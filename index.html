<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault 116 | Fort Rock Emergency</title><style>:root{--green:#b4ef71;--dark:#09170e;--muted:#8dbb7d}*{box-sizing:border-box}body{margin:0;background:#10130e;color:var(--green);font:18px/1.55 Consolas,'Courier New',monospace;padding:28px 16px}main{max-width:850px;margin:auto;border:2px solid #6da84d;background:linear-gradient(#102719,#09170e);box-shadow:0 0 35px #386e3b44;padding:clamp(20px,5vw,42px);min-height:620px}.top{border-bottom:2px solid #6da84d;padding-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;letter-spacing:2px}h1{font-size:clamp(24px,4vw,37px);line-height:1.15;text-transform:uppercase;margin:27px 0 8px;text-shadow:0 0 10px #6baa6a}h2{font-size:20px;color:#e6ffbc;margin:0 0 22px}.scene{white-space:pre-line;margin:24px 0 32px}.choice{display:block;width:100%;background:#132f1b;color:var(--green);border:1px solid #70a954;text-align:left;padding:15px 17px;margin:12px 0;font:inherit;cursor:pointer}.choice:hover,.choice:focus-visible{background:#315a2a;color:#fff;outline:2px solid #b4ef71}.status{border-top:1px solid #527b48;padding-top:15px;margin-top:30px;color:var(--muted);font-size:14px}.note{font-size:13px;color:#c3d2a5;margin-top:25px}strong{color:#fff7be}@media(max-width:520px){body{padding:0}main{min-height:100vh;border-width:0}}

</style></head><body><main><header class="top"><span>VAULT-TEC // VAULT 116</span><span>FORT ROCK OUTPOST</span></header><h1 id="title"></h1><h2 id="subtitle"></h2><div id="art" class="art" role="img" aria-label="Illustrated scene"></div><section id="story" class="scene" aria-live="polite"></section><nav id="choices" aria-label="Decisions"></nav><div class="status" id="status"></div><p class="note">Training simulation only. Choices are not transmitted to Blackboard or graded. Clinical responses are simplified for educational use.</p></main><script>
const scenes={start:{title:'A Wasteland Emergency',sub:'Scene 01 // Trading Post',body:'You arrive at Fort Rock Outpost after a long journey across the Oregon wasteland. A resident calls for help.\n\nA 54-year-old trader has collapsed near the entrance. He is conscious but confused, pale and clammy, and breathing rapidly. The settlement medic is attending another emergency.\n\nWhat will you do?',choices:[['Assess airway, breathing, circulation, and vital signs','assessment'],['Give him water and allow him to rest','water'],['Ask for a full medical history before assessing him','history']]},assessment:{title:'Critical Findings',sub:'Scene 02 // Initial Assessment',body:'Airway: patent. Respirations: 28/min, shallow. Heart rate: 124/min. Blood pressure: 78/42 mmHg. SpO₂: 92% on room air. Skin: cool and clammy. Mental status: confused.\n\nYou suspect shock. The cause is not yet clear. What is your priority?',choices:[['Call for urgent medical assistance, support ABCs, and prepare for rapid transfer','success'],['Wait 15 minutes and recheck his blood pressure','delay'],['Help him walk to the medical tent','walk']]},water:{title:'A Risky Delay',sub:'Consequence // Choice B',body:'The trader struggles to focus. He may not be able to swallow safely, and water does not address the cause of his poor perfusion.\n\nThe resident beside you asks, “Shouldn’t we check him first?”',choices:[['Stop, assess ABCs and vital signs now','assessment'],['Continue waiting for him to recover','delay']]},history:{title:'History Can Wait',sub:'Consequence // Choice C',body:'The trader can only answer in fragments. You learn he was feeling weak earlier, but his confusion makes a detailed history unreliable.\n\nImmediate assessment and stabilization take priority over a complete history.',choices:[['Assess ABCs and vital signs','assessment'],['Continue asking questions despite worsening confusion','delay']]},delay:{title:'Condition Worsens',sub:'Outcome // Delayed Escalation',body:'While you wait, the trader becomes less responsive. A nearby resident calls urgently for the medic.\n\nClinical takeaway: hypotension with altered mental status is a time-critical finding. Prompt recognition and escalation are essential.',choices:[['Rewind to the critical findings','assessment'],['Restart the adventure','start']]},walk:{title:'An Unsafe Transfer',sub:'Outcome // Patient Safety',body:'As you try to help him stand, the trader nearly collapses again. His blood pressure and mental status suggest he is not safe to walk.\n\nClinical takeaway: protect the patient from falls, maintain ABCs, and obtain urgent help rather than attempting ambulation.',choices:[['Choose a safer response','assessment'],['Restart the adventure','start']]},success:{title:'The Outpost Responds',sub:'Outcome // Timely Escalation',body:'You summon the medical team, continue assessing airway and breathing, keep the trader safe, and prepare for urgent treatment and transfer according to local protocols.\n\nThe medic arrives and takes over. Your early recognition of shock helped prevent further delay.\n\nFORT ROCK FIELD REPORT: Your clinical judgment made a difference.',choices:[['Play again and explore another path','start']]}};

function illustration(id){
const sceneType=({start:'outpost',assessment:'monitor',water:'water',history:'history',delay:'critical',walk:'critical',success:'recovery'})[id]||'outpost';
const sky='<rect width="900" height="370" fill="#2e2925"/><path d="M0 170 L110 98 185 151 280 80 380 162 485 100 590 164 700 75 820 147 900 102 V370 H0Z" fill="#534438"/><path d="M0 222 L160 182 300 218 470 170 620 220 760 177 900 201 V370 H0Z" fill="#776047"/><rect y="265" width="900" height="105" fill="#665039"/><circle cx="730" cy="67" r="36" fill="#c18a47" opacity=".65"/>';
const house='<path d="M65 212 L210 157 355 212 V316 H65Z" fill="#3c3027" stroke="#aa8457" stroke-width="6"/><path d="M44 210 L210 138 375 210" fill="none" stroke="#7b6653" stroke-width="21"/><rect x="170" y="240" width="68" height="76" fill="#181c18"/><rect x="91" y="228" width="57" height="48" fill="#b8894e"/><path d="M430 250 V145 M550 250 V145 M415 151 H570" stroke="#423b30" stroke-width="16"/><rect x="436" y="163" width="104" height="40" fill="#c69b5b"/><text x="488" y="190" text-anchor="middle" fill="#2a251f" font-size="18" font-family="monospace" font-weight="bold">FORT ROCK</text>';
const patient='<ellipse cx="650" cy="313" rx="152" ry="21" fill="#29261f"/><path d="M545 290 Q620 272 695 294 L753 319 713 329 640 311 570 325Z" fill="#6f7154" stroke="#292e27" stroke-width="5"/><circle cx="534" cy="296" r="26" fill="#b38b69" stroke="#3b332a" stroke-width="5"/><path d="M548 285 Q526 264 514 286" stroke="#554232" stroke-width="12" fill="none"/><path d="M720 312 L800 315" stroke="#383a30" stroke-width="20"/><path d="M680 305 L725 339" stroke="#383a30" stroke-width="17"/>';
const medic='<circle cx="400" cy="245" r="25" fill="#b18a65" stroke="#3d332c" stroke-width="5"/><path d="M385 272 L360 333 433 333 414 273Z" fill="#667b60" stroke="#27352c" stroke-width="5"/><path d="M384 286 L445 307" stroke="#b18a65" stroke-width="12"/><path d="M400 290 L470 303" stroke="#b18a65" stroke-width="10"/>';
const clinic='<rect x="85" y="55" width="730" height="275" rx="10" fill="#1b2920" stroke="#759568" stroke-width="8"/><path d="M120 205 H245 L276 175 307 246 345 112 379 221 417 205 H765" fill="none" stroke="#b4ef71" stroke-width="7"/><text x="120" y="103" fill="#d6b577" font-family="monospace" font-size="26">FORT ROCK // MEDICAL SCAN</text><text x="120" y="290" fill="#b4ef71" font-family="monospace" font-size="25">BP 78/42   HR 124   RR 28</text>';
const critical='<rect width="900" height="370" fill="#281b19"/><path d="M0 0H900V370H0Z" fill="none" stroke="#a35d3e" stroke-width="25"/><text x="450" y="120" text-anchor="middle" font-family="monospace" font-size="46" fill="#e4a078">WARNING</text><text x="450" y="186" text-anchor="middle" font-family="monospace" font-size="29" fill="#d4bb88">PATIENT CONDITION DETERIORATING</text><path d="M100 260 H270 L310 225 350 300 390 190 430 260 H800" fill="none" stroke="#d78c61" stroke-width="7"/>';
const recovery='<rect width="900" height="370" fill="#27372b"/><path d="M0 300 Q250 260 450 300 T900 290 V370 H0Z" fill="#53694a"/><rect x="130" y="130" width="640" height="190" fill="#80745b"/><path d="M100 140 L450 58 800 140Z" fill="#48473b"/><rect x="245" y="185" width="410" height="110" fill="#c1b08b"/><path d="M260 250 H640" stroke="#50634b" stroke-width="18"/><circle cx="380" cy="215" r="22" fill="#b8946d"/><path d="M402 227 L480 248" stroke="#60785b" stroke-width="24"/><text x="450" y="103" text-anchor="middle" fill="#e3d4a0" font-family="monospace" font-size="27">PATIENT STABILIZED</text>';
let graphic=sceneType==='monitor'?clinic:sceneType==='critical'?critical:sceneType==='recovery'?recovery:sky+house+patient+(sceneType==='outpost'?'':medic);
if(sceneType==='water')graphic+='<path d="M420 115 l18 30 -18 35 -18 -35Z" fill="#8bb8b4" stroke="#c1d3bd" stroke-width="3"/>';
if(sceneType==='history')graphic+='<rect x="710" y="120" width="120" height="125" fill="#c4ac7c" stroke="#594d39" stroke-width="8"/><path d="M731 156 H810 M731 180 H810 M731 205 H780" stroke="#635b44" stroke-width="5"/>';
const labels={outpost:'FORT ROCK OUTPOST // 2161',monitor:'MEDICAL SCAN // CRITICAL FINDINGS',water:'DECISION CONSEQUENCE // DELAY',history:'DECISION CONSEQUENCE // HISTORY',critical:'WARNING // EMERGENCY ESCALATION',recovery:'FIELD REPORT // OUTCOME'};
return '<svg viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+graphic+'</svg><div class="art-label">'+labels[sceneType]+'</div>';
}

let current='start',steps=0;function render(id){current=id;steps++;const s=scenes[id];document.getElementById('art').innerHTML=illustration(id);document.getElementById('title').textContent=s.title;document.getElementById('subtitle').textContent=s.sub;document.getElementById('story').textContent=s.body;const n=document.getElementById('choices');n.replaceChildren();s.choices.forEach(([label,target],i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`[${i+1}] ${label}`;b.onclick=()=>render(target);n.appendChild(b)});document.getElementById('status').textContent=`PIP-BOY 116 // DECISIONS EXPLORED: ${Math.max(0,steps-1)} // CURRENT: ${id.toUpperCase()}`;window.scrollTo({top:0,behavior:'smooth'})}render('start');
</script></body></html>
