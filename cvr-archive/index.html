
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault 116 CVR Holotape Archive</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #151711;
  font-family: Consolas, "Courier New", monospace;
  color: #a9ff70;
}

.archive {
  width: min(100%, 1100px);
  margin: 20px auto;
  position: relative;
}

.casing {
  display: block;
  width: 100%;
  height: auto;
}

.screen {
  position: absolute;
  left: 13.5%;
  top: 5.5%;
  width: 83%;
  height: 86%;
  background: #071307;
  color: #a9ff70;
  overflow: auto;
  padding: 3%;
  border-radius: 28px;
  box-shadow:
    inset 0 0 45px #143b10,
    inset 0 0 90px #000000;
  text-shadow: 0 0 5px #70ff50;
}

h1 {
  font-size: clamp(12px, 2.2vw, 25px);
  margin: 0 0 8px;
  border-bottom: 2px solid #a9ff70;
}

p {
  font-size: clamp(10px, 1.3vw, 15px);
}

button {
  width: 100%;
  background: transparent;
  color: #a9ff70;
  border: 1px solid #a9ff70;
  padding: 12px;
  margin: 8px 0;
  font: inherit;
  font-size: clamp(10px, 1.3vw, 15px);
  text-align: left;
  cursor: pointer;
}

button:hover, button:focus {
  background: #a9ff70;
  color: #071307;
}

audio {
  display: block;
  width: 100%;
  margin: 15px 0;
}

.hidden { display: none; }

.status {
  font-size: 12px;
  opacity: .85;
}

@media (max-width: 600px) {
  .archive { min-width: 360px; }
  .screen { padding: 2%; }
  button { padding: 6px; margin: 5px 0; }
}
</style>
</head>

<body>
<main class="archive">

<img
  class="casing"
  src="../pipboy_casing.png"
  alt="Vault-Tec Pip-Boy casing"
>

<div class="screen">
  <h1>VAULT 116</h1>
  <p>CVR HOLOTAPE ARCHIVE</p>

  <section id="menu">
    <p class="status">SELECT RECORDING:</p>

    <button onclick="openTape(1)">
      [01] CVR PART I
    </button>

    <button onclick="openTape(2)">
      [02] CVR PART II
    </button>

    <p>Shantelle &amp; Kristen</p>
    <p>Cardiovascular / Respiratory / Shock</p>
  </section>

  <section id="player" class="hidden">
    <p id="tapeTitle"></p>

    <audio id="audio" controls preload="metadata">
    </audio>

    <p id="message" class="status" role="status"></p>

    <button onclick="returnToMenu()">
      &lt; RETURN TO MENU
    </button>
  </section>
</div>

</main>

<script>
const tapes = {
  1: {
    title: "CVR HOLOTAPE - PART I",
    url: "../cvr-holotape-1/CVR%20Part%20I%20GitHub.m4a"
  },
  2: {
    title: "CVR HOLOTAPE - PART II",
    url: "../cvr-holotape-2/CVR%20Part%20II%20GitHub.m4a"
  }
};

const audio = document.getElementById("audio");
const menu = document.getElementById("menu");
const player = document.getElementById("player");
const message = document.getElementById("message");

function openTape(number) {
  const tape = tapes[number];

  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  document.getElementById("tapeTitle").textContent = tape.title;
  message.textContent = "Loading recording...";

  audio.src = tape.url;
  audio.load();

  menu.classList.add("hidden");
  player.classList.remove("hidden");
}

function returnToMenu() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  message.textContent = "";
  player.classList.add("hidden");
  menu.classList.remove("hidden");
}

audio.addEventListener("loadedmetadata", () => {
  message.textContent = "Recording ready. Press Play.";
});

audio.addEventListener("error", () => {
  message.textContent = "Unable to load recording.";
});
</script>
</body>
</html>
