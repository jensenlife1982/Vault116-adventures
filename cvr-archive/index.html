
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault 116 | CVR Holotape Archive</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #10170d;
    color: #a9ff70;
    font-family: Consolas, "Courier New", monospace;
  }
  .pipboy {
    max-width: 900px;
    min-height: 620px;
    margin: 24px auto;
    padding: 28px;
    border: 7px solid #536b3d;
    border-radius: 24px;
    background: #081507;
    box-shadow: 0 0 30px #456a2c;
  }
  h1 { font-size: 27px; margin: 0 0 8px; }
  .subtitle {
    border-bottom: 2px solid #a9ff70;
    padding-bottom: 15px;
  }
  .status { color: #d8ffad; font-size: 14px; }
  button {
    display: block;
    width: 100%;
    margin: 16px 0;
    padding: 18px;
    background: #122c0c;
    color: #a9ff70;
    border: 2px solid #a9ff70;
    font: inherit;
    font-size: 17px;
    cursor: pointer;
    text-align: left;
  }
  button:hover, button:focus {
    background: #a9ff70;
    color: #081507;
  }
  .hidden { display: none; }
  audio { width: 100%; margin: 20px 0; }
  .screen {
    border: 1px solid #658d46;
    padding: 20px;
    margin-top: 22px;
    min-height: 280px;
  }
  .label { color: #e4ffb5; }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    opacity: .75;
    text-align: center;
  }
  @media(max-width: 600px) {
    .pipboy { margin: 5px; padding: 15px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<main class="pipboy">
  <h1>VAULT 116</h1>
  <div class="subtitle">CVR HOLOTAPE ARCHIVE</div>
  <p class="status">VAULT-TEC EDUCATIONAL RECORDS // ACCESS GRANTED</p>

  <section id="menu" class="screen">
    <p class="label">SELECT AUDIO RECORDING:</p>
    <button onclick="openTape(1)">
      [01] CVR HOLOTAPE - PART I
    </button>
    <button onclick="openTape(2)">
      [02] CVR HOLOTAPE - PART II
    </button>
    <p>Recorded by Shantelle and Kristen</p>
    <p>Cardiovascular • Respiratory • Shock</p>
  </section>

  <section id="player" class="screen hidden">
    <h2 id="tapeTitle"></h2>
    <p>Vault 116 Medical Education Archive</p>
    <audio id="audio" controls preload="metadata"></audio>
    <p id="message" role="status"></p>
    <button onclick="returnToMenu()">
      &lt; RETURN TO HOLOTAPE MENU
    </button>
  </section>

  <div class="footer">
    VAULT-TEC MEDICAL TRAINING DIVISION // VAULT 116
  </div>
</main>

<script>
const tapes = {
  1: {
    title: "CVR HOLOTAPE - PART I",
    url: "../cvr-holotape-1/CVR%20Part%20I%20GitHub.m4a"
  },
  2: {
    title: "CVR HOLOTAPE - PART II",
    url: "../cvr-holotape-2/CVR%20Part%20II%20GitHub.m4a"
  }
};

const audio = document.getElementById("audio");
const menu = document.getElementById("menu");
const player = document.getElementById("player");
const message = document.getElementById("message");

function openTape(number) {
  const tape = tapes[number];
  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  document.getElementById("tapeTitle").textContent = tape.title;
  message.textContent = "Loading recording...";
  audio.src = tape.url;
  audio.load();

  menu.classList.add("hidden");
  player.classList.remove("hidden");
}

function returnToMenu() {
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  message.textContent = "";
  player.classList.add("hidden");
  menu.classList.remove("hidden");
}

audio.addEventListener("loadedmetadata", () => {
  message.textContent = "Recording ready. Press Play.";
});
audio.addEventListener("error", () => {
  message.textContent =
    "Unable to load recording. Check the audio file in GitHub.";
});
</script>
</body>
</html>
