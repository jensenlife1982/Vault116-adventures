<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault 116 | The Broken Signal</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(#343a2a,#070a07 80%);color:#b4fa95;font:16px/1.5 Consolas,"Courier New",monospace}

h1{text-align:center;font-size:clamp(23px,3vw,37px);line-height:1.2;margin:15px 0 3px}h2{text-align:center;font-size:14px;color:#d9b16b;margin:0 0 18px}

</style></head><body><main class="frame"><section class="crt"><header class="mast"><span>VAULT 116 // FIELD UNIT</span><b>WEEK 02 // COMPLEX NEURO</b><span>JACKSONVILLE // SETTLEMENT GATE</span></header><h1 id="title"></h1><h2 id="sub"></h2><div class="layout"><div class="scene"><img src="scene_01.jpg" id="sceneArt" alt="Green monochrome illustration of Jacksonville settlement gate and injured guard"><div class="stamp" id="stamp"></div></div><div class="narrative" id="narrative"></div><div class="choices" id="choices"></div><section class="debrief" id="debrief" hidden></section></div><footer class="foot"><span id="status">MISSION ACTIVE</span><span>FORMATIVE SIMULATION // NO GRADES</span><button class="small" id="restart">RESTART MISSION</button></footer></section></main><script>const nodes={"start": {"title": "THE BROKEN SIGNAL", "sub": "JACKSONVILLE // SETTLEMENT GATE DISTRESS", "text": "A raider explosive detonates near Jacksonville’s reinforced gate. A heavy steel panel tears loose and strikes guard Elias Rourke, 32, in the head, briefly knocking him unconscious. He is awake, nauseated, and insisting he can walk. The area is secure; a responder is nearby with a first-aid kit, oxygen, and a radio. What do you do first?", "options": [["Help Elias stand and walk to the clinic", "walk_fail", "Unassessed movement after significant blunt head trauma may worsen an associated cervical spine injury."], ["Perform a rapid ABC assessment while maintaining manual cervical spine stabilization and request evacuation", "primary", "You protect the spine and identify immediate threats."], ["Ask detailed questions about the raider attack", "delay", "History can follow the primary survey."]]}, "delay": {"title": "A DISTRACTING STORY", "sub": "RECOVERABLE PRIORITY ERROR", "text": "While Elias describes the blast, he vomits. The nearby responder asks you to focus on immediate threats.", "options": [["Give him water to settle his stomach", "walk_fail", "Oral fluids increase aspiration risk."], ["Return to airway, breathing, circulation and cervical spine protection", "primary", "Corrected priority."]]}, "primary": {"title": "INITIAL ASSESSMENT", "sub": "AIRWAY / BREATHING / CIRCULATION", "text": "Elias speaks in full sentences; respirations 18/min, SpO₂ 97% on room air, pulse 94, BP 138/84. There is a scalp abrasion but no uncontrolled hemorrhage. He remains supine with neutral cervical alignment. Which focused assessment is most useful now?", "options": [["Assess eye, verbal, and motor responses; pupils; and limb strength, establishing a baseline", "gcs", "Serial neurological findings help identify deterioration."], ["Remove spine precautions because he is speaking clearly", "spine_retry", "Being alert does not exclude cervical injury."], ["Give a sedative so he rests", "sedative_retry", "Sedation can obscure the neurological examination."]]}, "spine_retry": {"title": "PROTECT THE SPINE", "sub": "RECOVERABLE ERROR", "text": "A forceful blow to the head may also injure the cervical spine. Maintain spinal motion restriction while following trauma assessment and local protocol.", "options": [["Continue spinal protection and establish a neurological baseline", "gcs", "Corrected course."], ["Let him sit up and stretch his neck", "walk_fail", "Unsafe movement with possible unstable injury."]]}, "sedative_retry": {"title": "DO NOT MASK DETERIORATION", "sub": "RECOVERABLE ERROR", "text": "Unnecessary sedation can make serial neurological assessments difficult. Address pain and nausea with appropriate orders while preserving assessment reliability.", "options": [["Assess GCS, pupils, and limb movement", "gcs", "Appropriate assessment."], ["Give an unprescribed sedative anyway", "fail", "This delays recognition of worsening neurologic status."]]}, "gcs": {"title": "GLASGOW COMA SCALE", "sub": "BASELINE NEURO EXAM", "text": "Elias opens his eyes spontaneously (E4), is confused about the date but converses (V4), and obeys commands (M6). What is his GCS?", "options": [["14", "pupils", "E4 + V4 + M6 = 14."], ["12", "gcs_retry", "Recalculate each component."], ["15", "gcs_retry", "He is confused, so verbal response is not V5."]]}, "gcs_retry": {"title": "RECHECK THE COMPONENTS", "sub": "GCS PRACTICE", "text": "Eye opening 4 + confused conversation 4 + obeys commands 6. A GCS score must be reported with its component scores when possible.", "options": [["GCS 14 (E4 V4 M6)", "pupils", "Correct."], ["GCS 15 because he is awake", "gcs_retry", "Awake is not the same as fully oriented."]]}, "pupils": {"title": "THE FIRST WARNING", "sub": "FOCUSED NEUROLOGICAL FINDINGS", "text": "Both pupils are 3 mm and briskly reactive. Grip strength and foot movement are equal. Elias has a worsening headache and vomits again. A guard says, “He is talking—he’s fine.” Your response?", "options": [["Agree; concussion cannot be serious if he is awake", "reassure_retry", "A patient may deteriorate after a lucid interval."], ["Document the normal pupils and stop assessments", "reassure_retry", "One normal assessment does not rule out deterioration."], ["Recognize red flags, repeat neurological checks, and expedite emergency transport", "transport", "Worsening headache and repeated vomiting warrant urgent escalation."]]}, "reassure_retry": {"title": "DO NOT TRUST A SINGLE SNAPSHOT", "sub": "RECOVERABLE ERROR", "text": "Evolving intracranial injury may initially present with mild symptoms. Repeated vomiting and worsening headache are concerning despite earlier reassuring findings.", "options": [["Continue serial GCS, pupil, motor, and vital-sign checks while arranging urgent transfer", "transport", "You recognize change over time."], ["Let Elias sleep without monitoring", "fail", "This misses neurological deterioration."]]}, "transport": {"title": "A LONG ROAD TO HELP", "sub": "EVACUATION UNDERWAY", "text": "Radio reports a transport team is 20 minutes away. Ten minutes later, Elias opens his eyes only to speech (E3), speaks inappropriate words (V3), and localizes pain (M5). What is the new GCS?", "options": [["14; he is still responding", "decline_retry", "The component scores have changed."], ["11; a three-point decline from baseline", "decline", "Correct: E3 + V3 + M5 = 11."], ["8; he needs immediate intubation based on this score alone", "decline_retry", "Recalculate and assess the full clinical picture."]]}, "decline_retry": {"title": "SERIAL SCORES MATTER", "sub": "RECOVERABLE CALCULATION ERROR", "text": "E3 + V3 + M5 = 11. A decline from 14 to 11 is clinically significant and requires immediate escalation.", "options": [["Report GCS 11, a drop of three points, and request advanced emergency support", "decline", "Correct."], ["Wait for the next routine assessment", "fail", "Delayed escalation is unsafe."]]}, "decline": {"title": "SECONDARY BRAIN INJURY", "sub": "DETERIORATING NEURO STATUS", "text": "Elias is increasingly drowsy. BP 152/88, HR 76, RR 16. You suspect an evolving intracranial process. Which plan best protects him while waiting for higher-level care?", "options": [["Maintain oxygenation and perfusion, neutral head/neck alignment, avoid hypotension, reassess frequently, and urgently escalate", "position", "Appropriate supportive priorities."], ["Hyperventilate him aggressively to lower ICP without an order or signs of herniation", "vent_retry", "Routine prophylactic hyperventilation is not recommended."], ["Give a large dose of an unprescribed diuretic", "med_retry", "Medication decisions require appropriate orders and monitoring."]]}, "vent_retry": {"title": "VENTILATION IS NOT A SHORTCUT", "sub": "RECOVERABLE ERROR", "text": "Excessive ventilation can reduce cerebral blood flow. Support normal ventilation and oxygenation; advanced airway or rescue measures belong to qualified teams and protocols.", "options": [["Support oxygenation/perfusion and urgently escalate", "position", "Corrected care."], ["Continue forced hyperventilation as routine care", "fail", "Potentially worsens secondary brain injury."]]}, "med_retry": {"title": "STAY WITHIN SCOPE", "sub": "RECOVERABLE ERROR", "text": "Hyperosmolar therapies are used in selected patients by authorized clinicians with appropriate monitoring. Do not administer unprescribed medications in the field.", "options": [["Continue supportive measures and urgent escalation", "position", "Corrected care."], ["Give an unprescribed drug regardless", "fail", "Unsafe medication administration."]]}, "position": {"title": "THE POSITIONING QUESTION", "sub": "SUSPECTED INCREASED ICP", "text": "The responder suggests raising the head of the stretcher. Elias still has possible cervical spine injury and has not been cleared. Which action is best?", "options": [["Twist his neck to the side to improve drainage", "pos_retry", "Neck rotation may impair venous drainage and compromise spinal precautions."], ["Keep head/neck midline, avoid jugular compression, and use a coordinated whole-body head elevation if tolerated and permitted by trauma protocol", "pupil_change", "Correct: protect alignment and perfusion."], ["Lower his head below his feet regardless of status", "pos_retry", "Routine head-down positioning is not appropriate."]]}, "pos_retry": {"title": "ALIGNMENT AND PERFUSION", "sub": "RECOVERABLE ERROR", "text": "Maintain neutral head and cervical alignment; any elevation should avoid spinal movement and hypotension.", "options": [["Use coordinated positioning with spinal protection and frequent reassessment", "pupil_change", "Corrected care."], ["Ignore spinal precautions", "fail", "Unsafe handling."]]}, "pupil_change": {"title": "A NEW ASYMMETRY", "sub": "CRITICAL CHANGE", "text": "Elias now opens his eyes only to painful stimulation. His RIGHT pupil is 6 mm and sluggish; LEFT pupil is 3 mm and reactive. His left arm responds less strongly than the right. What does this suggest?", "options": [["Possible expanding intracranial lesion and impending herniation: notify advanced team immediately", "cushing", "This is a neurological emergency."], ["Normal variation; document for the next shift", "fail", "New anisocoria with declining responsiveness is an emergency."], ["A harmless medication effect, despite no medication exposure", "pupil_retry", "The evolving focal deficit is concerning."]]}, "pupil_retry": {"title": "FOCAL DEFICITS ARE RED FLAGS", "sub": "RECOVERABLE ERROR", "text": "A new unequal pupil with declining level of consciousness and weakness requires emergency escalation, not reassurance.", "options": [["Treat as critical deterioration and update the transport team immediately", "cushing", "Corrected recognition."], ["Wait to see if it resolves", "fail", "Delay risks catastrophic injury."]]}, "cushing": {"title": "THE LATE WARNING", "sub": "VITAL SIGNS SHIFT", "text": "BP 186/68, HR 48, and respirations become irregular. The responder asks why these findings are alarming.", "options": [["They prove the patient is recovering from shock", "cushing_retry", "This pattern is not reassuring."], ["This is likely a normal response to pain", "cushing_retry", "Bradycardia with widening pulse pressure and abnormal respirations is concerning."], ["Cushing triad is a late sign of markedly increased ICP and possible herniation", "handoff", "Correct; do not wait for the full triad before escalating."]]}, "cushing_retry": {"title": "LATE SIGNS OF INCREASED ICP", "sub": "RECOVERABLE ERROR", "text": "Hypertension with widening pulse pressure, bradycardia, and irregular respirations are classic late signs. Urgent advanced management is required.", "options": [["Recognize a possible herniation emergency and urgently escalate", "handoff", "Corrected recognition."], ["Reassure the guards and stop monitoring", "fail", "Misses life-threatening deterioration."]]}, "handoff": {"title": "THE RESCUE TEAM ARRIVES", "sub": "SBAR HANDOFF", "text": "An advanced transport team arrives with airway equipment. Which report is most useful?", "options": [["“He got hit, but he looks pretty bad now.”", "handoff_retry", "This omits objective trends."], ["“We think he has a concussion; you can take it from here.”", "handoff_retry", "Avoid premature diagnostic closure."], ["“32-year-old struck in head by blast-displaced steel gate panel with brief LOC; GCS 14 (E4 V4 M6) to 11 (E3 V3 M5), now worsening LOC, right pupil 6 mm sluggish, left weakness, BP 186/68, HR 48, irregular breathing. C-spine protected; urgent neurosurgical evaluation needed.”", "success", "Clear trend, findings, actions, and urgency."]]}, "handoff_retry": {"title": "MAKE THE CHANGE VISIBLE", "sub": "RECOVERABLE COMMUNICATION ERROR", "text": "The receiving team needs mechanism, serial GCS components, pupil and motor changes, vital-sign trends, precautions, and interventions.", "options": [["Deliver a concise structured handoff with neurological trends and urgent needs", "success", "Appropriate escalation."], ["Give only “head injury, stable”", "fail", "Critical deterioration is omitted."]]}, "walk_fail": {"title": "MISSION FAILED", "sub": "UNSAFE SPINAL MOVEMENT", "text": "Elias becomes less responsive after avoidable movement. The simulation ends here. Protect cervical alignment after significant blunt head trauma while performing a primary survey.", "options": [["Restart the mission", "start", "Try again with an ABC and spinal-safety approach."]]}, "fail": {"title": "MISSION FAILED", "sub": "CRITICAL DELAY", "text": "A critical warning was ignored and the patient deteriorated without timely intervention. Review the feedback, then retry the mission.", "options": [["Restart mission", "start", "Practice early recognition and escalation."]]}, "success": {"title": "MISSION COMPLETE", "sub": "JACKSONVILLE // EVACUATION CONFIRMED", "text": "The advanced team assumes airway and transport care. Elias is transferred for emergency neuroimaging and neurosurgical evaluation. Your timely recognition, reassessment, spinal precautions, and clear handoff gave him the best chance of avoiding secondary injury.", "options": [["Replay the mission", "start", "Explore alternate choices and their consequences."]]}};const sceneImages={"start": 1, "delay": 1, "primary": 1, "spine_retry": 2, "sedative_retry": 2, "gcs": 6, "gcs_retry": 6, "pupils": 2, "reassure_retry": 10, "transport": 3, "decline_retry": 11, "decline": 11, "vent_retry": 7, "med_retry": 7, "position": 7, "pos_retry": 7, "pupil_change": 2, "pupil_retry": 14, "cushing": 3, "cushing_retry": 15, "handoff": 4, "handoff_retry": 8, "walk_fail": 9, "fail": 12, "success": 16};let history=[];function render(id){document.querySelector("#sceneArt").src="scene_"+String(sceneImages[id]||1).padStart(2,"0")+".jpg";let n=nodes[id];document.querySelector('#title').textContent=n.title;document.querySelector('#sub').textContent=n.sub;document.querySelector('#narrative').textContent=n.text;document.querySelector('#stamp').textContent=n.sub;let ch=document.querySelector('#choices');ch.replaceChildren();n.options.forEach(([label,next,reason],i)=>{let b=document.createElement('button');b.className='choice';b.textContent='['+(i+1)+'] '+label;b.onclick=()=>{if(next==='start')history=[];else history.push({label,reason});render(next)};ch.appendChild(b)});let d=document.querySelector('#debrief');d.hidden=!['success','fail','walk_fail'].includes(id);if(!d.hidden){d.innerHTML='<h3>MISSION DEBRIEF // NEUROLOGICAL TRAUMA</h3><p><b>Primary survey:</b> Prioritize airway, breathing, circulation, and cervical spine protection after significant blunt head trauma.</p><p><b>Serial neurological assessment:</b> Record GCS components, pupil size/reactivity, motor findings, and vital signs. A decline from GCS 14 to 11 is clinically significant.</p><p><b>Early warnings:</b> Worsening headache, repeated vomiting, confusion, and declining responsiveness require urgent reassessment and escalation.</p><p><b>Secondary brain injury:</b> Prevent hypoxemia and hypotension; maintain neutral head/neck alignment and avoid routine prophylactic hyperventilation.</p><p><b>Late signs:</b> New anisocoria, focal weakness, and Cushing triad raise concern for markedly elevated ICP and herniation.</p><p><b>Communication:</b> Handoff includes mechanism, neurological trends, vital signs, and interventions.</p><p class="muted">Formative educational simulation; no grades or Blackboard tracking.</p><h3>YOUR DECISION TRAIL</h3>'+history.map((h,i)=>'<p>'+(i+1)+'. '+escapeHtml(h.label)+' — '+escapeHtml(h.reason)+'</p>').join('')}document.querySelector('#status').textContent=id==='success'?'MISSION COMPLETE':(id==='fail'||id==='walk_fail')?'MISSION FAILED':'MISSION ACTIVE';window.scrollTo(0,0)}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#restart').onclick=()=>{history=[];render('start')};render('start');</script></body></html>
