<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault 116 | Brotherhood Under Fire</title><style>*{box-sizing:border-box}body{margin:0;padding:2vw;background:radial-gradient(#343a2a,#070a07 80%);color:#b4fa95;font:16px/1.5 Consolas,"Courier New",monospace}.frame{max-width:1250px;margin:auto;position:relative;padding:5% 7%;background:#493824;border:12px ridge #87613c;border-radius:65px;box-shadow:0 25px 80px #000}.frame:before{content:"";position:absolute;inset:0;background:url("pipboy_casing.png") center/100% 100% no-repeat;pointer-events:none;z-index:3}.crt{position:relative;z-index:4;background:radial-gradient(#12351b,#041208);border:6px solid #192717;border-radius:24px;padding:24px;box-shadow:inset 0 0 50px #000}.mast{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:2px;border-bottom:2px solid #6eaa56;padding-bottom:9px}.mast b{color:#e3b66e}h1{text-align:center;font-size:clamp(23px,3vw,37px);line-height:1.2;margin:15px 0 3px}h2{text-align:center;font-size:14px;color:#d9b16b;margin:0 0 18px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.scene{border:2px solid #71b65d;background:#061508}.scene img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;filter:contrast(1.12)}.stamp{padding:8px;font-size:12px;color:#d8b776}.narrative{white-space:pre-line;font-size:clamp(14px,1.5vw,19px)}.choices{grid-column:1/-1;border:2px solid #528b46;border-radius:9px;padding:12px}.choice{width:100%;text-align:left;padding:13px;margin:4px 0;border:1px solid #528b46;background:#0c2010;color:#c4ffae;font:inherit;cursor:pointer}.choice:hover,.choice:focus-visible{background:#a2f17d;color:#071508;outline:2px solid #e5ffcd}.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px;color:#d1b275;font-size:12px}.debrief{grid-column:1/-1;border:1px solid #5b9e50;padding:15px}.debrief h3{color:#e3bd79;margin:0 0 8px}.debrief p{margin:7px 0}.muted{color:#8fc17b;font-size:12px}button.small{background:#142819;color:#d2edbd;border:1px solid #679c54;padding:8px;cursor:pointer}@media(max-width:760px){body{padding:0}.frame{border-width:5px;border-radius:12px;padding:8px}.frame:before{display:none}.crt{padding:12px}.layout{grid-template-columns:1fr}.choices,.debrief{grid-column:1} }</style></head><body><main class="frame"><section class="crt"><header class="mast"><span>VAULT 116 // FIELD UNIT</span><b>WEEK 08 // BURNS & TRAUMA</b><span>NEW BEND → TIMBERLINE</span></header><h1 id="title"></h1><h2 id="sub"></h2><div class="layout"><div class="scene"><img src="scene_ambush.png" alt="Green monochrome illustration of the current Brotherhood field rescue scene"><div class="stamp" id="stamp"></div></div><div class="narrative" id="narrative"></div><div class="choices" id="choices"></div><section class="debrief" id="debrief" hidden></section></div><footer class="foot"><span id="status">MISSION ACTIVE</span><span>FORMATIVE SIMULATION // NO GRADES</span><button class="small" id="restart">RESTART MISSION</button></footer></section></main><script>const nodes={"start":{"title":"THE ROAD TO TIMBERLINE","sub":"NEW BEND → TIMBERLINE STATION // AMBUSH SITE","text":"Smoke rises from a Brotherhood of Steel patrol carrier. The mutants have retreated, but three soldiers are injured. Their field medic has one oxygen kit, sterile dressings, thermal blankets, IV supplies, and a radio. The area is secure for now. What is your FIRST move?","options":[["Start dressing the most visible arm burn","misprioritize","A visible burn may distract from airway threats."],["Establish scene safety, call for evacuation, and begin a rapid primary survey","triage","You secure the scene and prioritize life threats."],["Apply burn cream to all casualties immediately","misprioritize","Topical treatment is not the first priority in major trauma."]]},"misprioritize":{"title":"PRIORITY CHECK","sub":"RECOVERABLE ERROR","text":"The field medic stops you: “We have multiple casualties. Someone may have an airway injury or uncontrolled bleeding. Look at all of them first.”","options":[["Return to scene safety, call for help, and primary survey","triage","You corrected your priorities."],["Ignore the medic and continue wound care","fail","You delayed recognition of immediate threats."]]},"triage":{"title":"THREE WOUNDED KNIGHTS","sub":"PRIMARY SURVEY // WHO FIRST?","text":"KNIGHT HALE: facial and neck plasma burns, soot at mouth, hoarse voice, increasing stridor. KNIGHT ORTIZ: deep blistered burns across anterior trunk and entire left arm; awake, tachycardic. SQUIRE VOSS: small pale, leathery, insensate laser burn on forearm; alert, stable. No uncontrolled external bleeding is found. Who needs immediate attention?","options":[["Ortiz: large burn area and possible shock","triage_retry","Serious, but Hale has an immediate airway threat."],["Voss: full-thickness burn must hurt the most","triage_retry","Depth matters, but stable isolated injury is not first."],["Hale: suspected inhalation injury and threatened airway","airway","Correct: an evolving airway threat takes precedence."]]},"triage_retry":{"title":"TRIAGE REASSESSMENT","sub":"AIRWAY BEFORE WOUND DEPTH","text":"Hale develops louder stridor. Full-thickness burns may be relatively insensate; injury depth alone does not determine first priority. You have a chance to redirect.","options":[["Treat Hale as an airway emergency; summon advanced airway support","airway","You recognized the time-critical problem."],["Wait until Hale stops breathing to intervene","fail","Failure to act on progressive airway compromise is unsafe."]]},"airway":{"title":"KNIGHT HALE","sub":"INHALATION INJURY SUSPECTED","text":"Hale is conscious but hoarse, with soot around the mouth and worsening stridor. The medic asks what to do while the evacuation team approaches.","options":[["Use pulse oximetry alone to rule out carbon monoxide exposure","airway_retry","Standard pulse oximetry can be falsely reassuring in carbon monoxide exposure."],["Give high-concentration oxygen, monitor airway, request immediate advanced airway team and urgent evacuation","survey","Correct: anticipate early airway control by qualified clinicians."],["Place Hale flat and offer oral fluids","fail","This ignores an evolving airway emergency."]]},"airway_retry":{"title":"MONITOR LIMITATION","sub":"PULSE OXIMETRY ≠ CO-OXIMETRY","text":"The medic notes that conventional SpO₂ cannot reliably detect carboxyhemoglobin. Clinical signs and exposure history matter; advanced evaluation is needed.","options":[["Give oxygen and escalate for urgent airway evaluation and evacuation","survey","You corrected the assessment error."],["Delay care until a perfect SpO₂ reading is obtained","fail","You delayed an airway emergency."]]},"survey":{"title":"KNIGHT ORTIZ","sub":"SECONDARY SURVEY // BURN SIZE","text":"With Hale receiving oxygen and advanced airway help en route, assess Ortiz. Deep partial-thickness burns involve the ENTIRE anterior trunk (chest + abdomen) and the ENTIRE left arm. No other burns. For an adult, what TBSA is burned using the Rule of Nines?","options":[["36% TBSA: count the full trunk rather than anterior only","tbsa_retry","Only the anterior trunk is burned."],["18% TBSA: count the trunk but not the arm","tbsa_retry","You omitted a burned region."],["27% TBSA: anterior trunk 18% + entire arm 9%","depth","Correct calculation."]]},"tbsa_retry":{"title":"RULE OF NINES","sub":"RECOVERABLE CALCULATION ERROR","text":"Adult Rule of Nines: anterior trunk 18%, posterior trunk 18%, each entire arm 9%. Add only the areas actually burned. Superficial erythema is not counted in burn TBSA.","options":[["Recalculate: 18% + 9% = 27% TBSA","depth","You corrected the calculation."],["Treat it as a minor burn because Ortiz is awake","fail","Major burns require urgent systemic assessment."]]},"depth":{"title":"DEPTH AND PERFUSION","sub":"ORTIZ // SHOCK RISK","text":"Ortiz has moist blistered patches mixed with pale, less-blanching regions; HR 126, BP 92/58, cool extremities. He is alert but thirsty. Voss has a small dry, leathery, insensate patch. Which interpretation is most accurate?","options":[["Ortiz is stable because he is speaking normally","depth_retry","Tachycardia and low BP require urgent reassessment."],["Ortiz has partial-thickness burns and possible hypovolemia; Voss has a likely full-thickness burn","fluids","Correct: evaluate depth and systemic perfusion separately."],["Voss has a superficial burn because it is painless","depth_retry","Painless leathery skin suggests full-thickness injury."]]},"depth_retry":{"title":"BURN DEPTH CHECK","sub":"RECOVERABLE ERROR","text":"Partial-thickness burns may blister and be moist; deep partial-thickness burns may blanch poorly. Full-thickness injury can be dry, leathery, and relatively insensate because nerve endings are destroyed.","options":[["Address Ortiz’s perfusion risk and recognize Voss’s full-thickness injury","fluids","You corrected your assessment."],["Ignore Ortiz’s vital signs and focus on pain scores only","fail","You missed possible shock."]]},"fluids":{"title":"FIELD RESUSCITATION","sub":"MAJOR BURN // FIRST HOURS","text":"Ortiz has 27% TBSA partial-thickness burns. The medic can establish IV access and has isotonic crystalloid. Evacuation will take time. What is the best plan?","options":[["Give unrestricted oral water as the only resuscitation","fluid_retry","This is inadequate for a major burn with shock signs."],["Use an estimated fluid formula as an exact fixed dose regardless of response","fluid_retry","Burn fluid estimates require reassessment and titration."],["Initiate protocol-guided warmed isotonic crystalloid with medical direction; track vitals, mental status, urine output and reassess","wounds","Correct: formulas are starting estimates; titrate to clinical response."]]},"fluid_retry":{"title":"RESUSCITATION CHECK","sub":"RECOVERABLE ERROR","text":"Major burns can cause capillary leak and hypovolemia. Establish access, follow local burn protocols and medical orders, and monitor perfusion and urine output. Avoid both under- and over-resuscitation.","options":[["Start protocol-guided IV resuscitation and ongoing reassessment","wounds","You corrected the plan."],["Wait until the soldier loses consciousness","fail","Delayed resuscitation can worsen shock."]]},"wounds":{"title":"BURN WOUND CARE","sub":"FIELD KIT INVENTORY","text":"The fire is out. The medic has sterile dry nonadherent dressings, clean water, thermal blankets and scissors. What should the team do next for Ortiz and Voss?","options":[["Peel away clothing stuck to burned tissue and rupture blisters","wound_retry","Adherent clothing and blisters should not be forcibly removed in the field."],["Remove loose jewelry and nonadherent gear; cover burns with clean dry dressings, prevent hypothermia, and monitor distal circulation","circ","Correct: protect tissue and maintain warmth."],["Apply ice packs directly to the burns","wound_retry","Ice may worsen tissue damage and hypothermia."]]},"wound_retry":{"title":"WOUND CARE CORRECTION","sub":"RECOVERABLE ERROR","text":"Do not apply ice or tear off adherent material. Cover wounds with clean dry dressings; avoid prolonged cooling of extensive burns because of hypothermia risk. Remove constricting items when safe.","options":[["Protect wounds, remove loose constricting items, and keep patients warm","circ","You corrected the wound-care approach."],["Continue ice treatment despite shivering","fail","You increased risk of hypothermia."]]},"circ":{"title":"ARMORED GAUNTLET","sub":"CIRCULATION REASSESSMENT","text":"Ortiz’s left arm is swelling beneath a damaged gauntlet. His fingers are cool and numb; capillary refill is delayed. What matters most?","options":[["Cut deeply into the burned arm yourself to release pressure","fail","Escharotomy is an advanced procedure for qualified clinicians."],["Ignore distal findings because the burn is on the skin","circ_retry","Neurovascular compromise is a limb-threatening complication."],["Remove constricting gear if safe, check pulses/sensation/movement, elevate appropriately, and urgently report possible vascular compromise","handoff","Correct: circumferential injury or swelling may threaten perfusion."]]},"circ_retry":{"title":"LIMB THREAT","sub":"RECOVERABLE ERROR","text":"Worsening pain, pallor, paresthesia, coolness, weak pulses, or impaired movement require immediate neurovascular reassessment and escalation. The burn team may need advanced interventions.","options":[["Report neurovascular findings urgently and continue reassessment","handoff","You corrected the priority."],["Wait until the hand becomes pulseless before calling","fail","You delayed recognition of limb ischemia."]]},"handoff":{"title":"EVACUATION RADIO","sub":"SBAR // THREE CASUALTIES","text":"A rescue team is approaching. The commander asks for a concise report. Which handoff best supports safe transfer?","options":[["Say only that three soldiers have laser burns","handoff_retry","Mechanism alone omits severity and immediate threats."],["Report Hale’s airway threat, Ortiz’s 27% TBSA and perfusion findings, Voss’s full-thickness injury, treatments, trends and transport priorities","success","Clear, prioritized communication."],["Say everyone is stable and can walk to Timberline","fail","You concealed critical injuries."]]},"handoff_retry":{"title":"INCOMPLETE SBAR","sub":"RECOVERABLE ERROR","text":"The rescue medic needs who is most critical, mechanism, airway findings, burn extent/depth, circulation, treatments already given, and response to care.","options":[["Provide a structured prioritized SBAR","success","You supplied critical information."],["End the call without describing airway compromise","fail","The receiving team was not warned of a threatened airway."]]},"success":{"title":"MISSION COMPLETE","sub":"BROTHERHOOD UNDER FIRE // DEBRIEF","text":"The rescue team takes over advanced airway management, ongoing resuscitation and burn-center transport. The Brotherhood soldiers have a safer chance because you prioritized immediate threats, calculated burn area, prevented complications and communicated clearly. Their ultimate outcomes depend on definitive care.","options":[["Replay mission","start","Start again."]]},"fail":{"title":"MISSION FAILED","sub":"CLINICAL SAFETY OVERRIDE","text":"A critical life or limb threat was delayed or an unsafe intervention was selected. Review the debrief and restart. This simulation is formative: no grades or bottle caps.","options":[["Restart mission","start","Start again."]]}};const sceneArt={"start":1,"misprioritize":2,"triage":2,"triage_retry":3,"airway":4,"airway_retry":3,"survey":5,"tbsa_retry":5,"depth":6,"depth_retry":6,"fluids":7,"fluid_retry":7,"wounds":8,"wound_retry":8,"circ":9,"circ_retry":9,"handoff":10,"handoff_retry":10,"success":12,"fail":11};let history=[];function render(id){let n=nodes[id];document.querySelector('.scene img').src='scene_'+String(sceneArt[id]||1).padStart(2,'0')+'.jpg';document.querySelector('#title').textContent=n.title;document.querySelector('#sub').textContent=n.sub;document.querySelector('#narrative').textContent=n.text;document.querySelector('#stamp').textContent=n.sub;let ch=document.querySelector('#choices');ch.replaceChildren();n.options.forEach(([label,next,reason],i)=>{let b=document.createElement('button');b.className='choice';b.textContent='['+(i+1)+'] '+label;b.onclick=()=>{if(next==='start')history=[];else history.push({label,reason});render(next)};ch.appendChild(b)});let d=document.querySelector('#debrief');d.hidden=!['success','fail'].includes(id);if(!d.hidden){d.innerHTML='<h3>MISSION DEBRIEF // CLINICAL JUDGMENT</h3><p><b>Recognize cues:</b> Progressive stridor and facial burns indicate a threatened airway. Airway, breathing, circulation, and hemorrhage control precede detailed burn dressing.</p><p><b>Burn depth:</b> Blistering and moisture suggest partial thickness; dry leathery relatively insensate tissue suggests full thickness. Mixed depths may coexist.</p><p><b>Rule of Nines:</b> Adult anterior trunk 18% + entire arm 9% = 27% TBSA; superficial burns are excluded from burn-resuscitation TBSA.</p><p><b>Systemic care:</b> Major burns cause capillary leak, hypovolemia and heat loss. Follow protocol-guided IV fluid resuscitation with repeated perfusion and urine-output assessment; avoid over-resuscitation.</p><p><b>Field priorities:</b> Oxygen and urgent advanced airway evaluation for suspected inhalation injury, clean dry coverings, prevention of hypothermia, neurovascular checks, pain management under orders, and rapid transfer to a burn-capable center.</p><p><b>Trauma integration:</b> Reassess for occult blunt or penetrating injuries and ongoing hemorrhage. This mission emphasizes primary survey, triage, and stabilization.</p><p><b>Reflect:</b> Why was Hale treated before Ortiz? How would the plan change if one patient had uncontrolled major bleeding?</p><p class="muted">Fictional laser/plasma burns are modeled as thermal injuries for educational purposes. Ungraded; no data is saved or sent to Blackboard.</p><h3>YOUR DECISION TRAIL</h3>'+history.map((h,i)=>'<p>'+(i+1)+'. '+escapeHtml(h.label)+' — '+escapeHtml(h.reason)+'</p>').join('')}document.querySelector('#status').textContent=id==='success'?'MISSION COMPLETE':id==='fail'?'MISSION FAILED':'MISSION ACTIVE';window.scrollTo(0,0)}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#restart').onclick=()=>{history=[];render('start')};render('start');</script></body></html>
